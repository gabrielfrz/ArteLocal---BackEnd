name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Set DATABASE_URL to Neon URL
        run: echo "DATABASE_URL=postgresql://neondb_owner:npg_kGowS10zlZrO@ep-twilight-feather-acpyqp95-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require" >> $GITHUB_ENV

      - run: npx eslint . --max-warnings=0

      - run: npm test
